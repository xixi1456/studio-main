<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="招新群二维码占位图">
  <!-- 浅色底：真实二维码需要浅底才扫得动，占位图也用浅底，换图后观感一致 -->
  <rect width="320" height="320" fill="#FFFFFF"/>
  <defs>
    <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#0A0A0A" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#g)"/>
  <!-- 四角括号 -->
  <g fill="none" stroke="#FF4D2E" stroke-width="3" stroke-linecap="square">
    <path d="M32 72V32h40"/>
    <path d="M248 32h40v40"/>
    <path d="M288 248v40h-40"/>
    <path d="M72 288H32v-40"/>
  </g>
  <circle cx="160" cy="124" r="18" fill="none" stroke="#0A0A0A" stroke-opacity="0.28" stroke-width="2"/>
  <path d="M152 116l20 8-20 8z" fill="#FF4D2E"/>
  <text x="160" y="176" text-anchor="middle" fill="#0A0A0A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="600">二维码占位</text>
  <text x="160" y="200" text-anchor="middle" fill="#0A0A0A" fill-opacity="0.5" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.6">QR PLACEHOLDER</text>
  <text x="160" y="228" text-anchor="middle" fill="#0A0A0A" fill-opacity="0.42" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.6">把群二维码替换到</text>
  <text x="160" y="244" text-anchor="middle" fill="#0A0A0A" fill-opacity="0.42" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.6">/images/join/qrcode.png</text>
</svg>
